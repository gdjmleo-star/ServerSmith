services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    ports:
      - "18080:18080"
    volumes:
      - ./server:/app
      - ./data:/data
    environment:
      - DB_PATH=/data/serversmith.db
      - PORT=18080
    networks:
      - serversmith-net

  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "13000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18080
    command: sh -c "npm install && npm run dev"
    networks:
      - serversmith-net
    depends_on:
      - server

networks:
  serversmith-net:
    driver: bridge
